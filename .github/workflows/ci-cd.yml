name: CI/CD CyberArca

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Integração Contínua
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest -r requirements.txt

      - name: Verificar erros graves (flake8)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Executar testes (pytest)
        run: pytest -v

  cd:
    name: Entrega Contínua
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Gerar executável
        run: pyinstaller --noconfirm --name CyberArca main.py

      - name: Compactar e gerar checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist/CyberArca -DestinationPath CyberArca-windows.zip
          (Get-FileHash CyberArca-windows.zip -Algorithm SHA256).Hash | Out-File CyberArca-windows.zip.sha256 -Encoding ascii

      - name: Publicar Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            CyberArca-windows.zip CyberArca-windows.zip.sha256 \
            --title "CyberArca v1.0.${{ github.run_number }}" \
            --generate-notes